<text class="vt" x="40" y="1185">Открытые вопросы к владельцу (после решения по куполу):</text>
<text class="sub" x="40" y="1207">1. Хатч. Стыковочный порт куба стоит на его стенке +Y (4 м от оси), а обшивка на этой станции — на 8 м. Между ними 4 м корпуса: нужен тамбур-тоннель, либо порт переезжает на обшивку и стыковка требует правки.</text>
<text class="sub" x="40" y="1229">2. Длина. 48.9 м принята как нос — корма нижних крыльев; шипы-антенны (до 60 м по X, 15 м вверх) в неё не входят. Если 全長 у дизайнера включал шипы, корпус ужимается примерно до 38 м, и кабина не помещается вовсе.</text>
<text class="sub" x="40" y="1251">3. Двигатели физики (±2 м, четыре угла на плоскости Z=0) — точки приложения силы, не сопла. Видимые сопла на модели — синие круги гондол и транец; их положение на физику не влияет.</text>
<text class="sub" x="40" y="1273">4. Что такое купол. У новеллы кокпит впереди, жилой отсек за ним; на арте перед куполом стоит блок с окном-полосой. Купол читается как надстройка над жилым отсеком, окно — как кокпит. На компоновку интерьера это влияет, на модель корпуса — нет.</text>
</svg>