<text class="title" x="40" y="42">ASX-08 «Кришна» — чертёж в трёх проекциях, третий проход по официальному арту</text>
<text class="sub" x="40" y="64">Полная длина 48.9 м — официальный сайт аниме-адаптации saikyosoubi.com: «小型艦 クリシュナ 全長 48.9ｍ». Шипы-антенны в 48.9 не входят (принятое допущение). Купол 12.5 м — решение владельца от 2026-09-22.</text>
<text class="sub" x="40" y="82">Сетка 5 м. Красным — кабина текущего тестового корабля (куб 8 м), её хатч 2×2.5 м в правом борту и четыре угла двигателей физики на ±2 м.</text>
