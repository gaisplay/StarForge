[ConsoleVariables]
; Continuous collision for the ship hulls. Today the hull is the only body in the project with
; bUseCCD (SFTestShip.cpp), so these two lines change nothing else; any body given bUseCCD later
; inherits them, because they are global to Chaos.
;
; The margin they protect is 20 cm. Two hulls face to face put the other ship's outer panel face
; (+/-410 cm) against this cabin's interior volume edge (+/-390 cm), and every centimetre of
; interpenetration past 410 - 390 = 20 brings the other ship's volume onto a man standing at the
; wall; a volume binds whoever it touches.
;
; Both scales multiply the shape's extent, which for a hull box is its full 800 cm
; (FPBDCollisionConstraint::InitCCDThreshold takes BoundingBox().Extents().GetAbsMin()).
;   EnableThresholdBoundsScale 0.01: a step in which the pair moves relative to each other by more
;     than 0.01 x 800 = 8 cm on an axis is swept (FCCDHelpers::DeltaExceedsThreshold, CCDUtilities.cpp).
;   AllowedDepthBoundsScale 0.005: a swept step is rolled back to at most 0.005 x 800 = 4 cm deep.
;     The engine requires this to be below the threshold (CCDUtilities.cpp 39), and it is.
; Penetration is therefore bounded by the larger of an unswept step, under 8 cm, and the rollback
; allowance, 4 cm: at most 8 cm along a face at any frame rate (8 x sqrt 3 = 13.9 cm along a
; diagonal, since the test is per axis), inside the 20 cm margin. The bound is in centimetres, not
; in steps, so it holds whatever the frame rate.
;
; The engine defaults, 0.4 and 0.2, sweep only steps over 320 cm and leave up to 160 cm. With them a
; duel colliding at 81 m/s measured 67 cm of interpenetration at 60 fps.
p.Chaos.CCD.EnableThresholdBoundsScale=0.01
p.Chaos.CCD.AllowedDepthBoundsScale=0.005
