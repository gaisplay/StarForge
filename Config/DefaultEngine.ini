[ConsoleVariables]
; Continuous collision for the ship hulls. Today the hull is the only body in the project with
; bUseCCD (SFTestShip.cpp), so these two lines change nothing else; any body given bUseCCD later
; inherits them, because they are global to Chaos.
;
; Both scales multiply the shape's extent, which for a hull box is its full 800 cm
; (FPBDCollisionConstraint::InitCCDThreshold takes BoundingBox().Extents().GetAbsMin()).
;   EnableThresholdBoundsScale 0.01: a step in which the pair moves relative to each other by more
;     than 0.01 x 800 = 8 cm on an axis is swept (FCCDHelpers::DeltaExceedsThreshold, CCDUtilities.cpp).
;   AllowedDepthBoundsScale 0.005: a swept step is rolled back to at most 0.005 x 800 = 4 cm deep.
;     The engine requires this to be below the threshold (CCDUtilities.cpp 39), and it is.
;
; What this does NOT give is a bound on penetration. Only steps longer than 8 cm are swept, and
; ordinary contact can still build penetration over several unswept steps. Measured on the combat
; rig's duel, where the pirate arrives pitched 8.53 deg and first touches at 854.9 cm between
; centres (separating-axis calculation; first response logged at 853.8 cm): the engine defaults,
; 0.4 and 0.2, which sweep only steps over 320 cm, let the hulls overlap by about 122 cm at 60 fps;
; these figures cut that to about 10 cm at 60 fps and leave about 37 cm at 400 fps, where after the
; first impulse the hulls close at about 30 m/s, 7.45 cm a step, under the threshold.
;
; A man at the struck wall is 20 cm from the other ship's interior volume (outer panel face at
; +/-410 cm, cabin volume edge at +/-390), so these figures do not protect him. The handover guard
; does: a volume hands a person between carriers only while they move within 1.0 m/s of each other
; where he stands (SFInteriorVolumeComponent.cpp). These are kept for what they do buy -- less
; overlap, and so less of the other hull where it has no business being.
p.Chaos.CCD.EnableThresholdBoundsScale=0.01
p.Chaos.CCD.AllowedDepthBoundsScale=0.005
