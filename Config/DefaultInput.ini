[/Script/Engine.InputSettings]
bEnableMouseSmoothing=True
DefaultViewportMouseCaptureMode=CapturePermanently_IncludingInitialMouseDown
DefaultPlayerInputClass=/Script/EnhancedInput.EnhancedPlayerInput
DefaultInputComponentClass=/Script/EnhancedInput.EnhancedInputComponent

; The engine binds the console to Tilde alone (BaseInput.ini:16). On a non-Latin
; keyboard layout the key left of "1" does not deliver Tilde, and the console never
; opens -- silently, which is the worst way for it to fail. Checkpoint 4 run B was
; attempted on 2026-09-10 and lost: every E press reached the game and was logged,
; but not one console command did, so the pilot's seat was never freed and the run
; could not proceed past its second step.
;
; F1 is added as a second key because it is layout-independent and unbound here: the
; rig reads W A S D, the arrows, Q R E, F for docking, Space and LeftCtrl, and
; nothing else.
; Tilde is kept, so a Latin layout behaves exactly as before.
;
; This matters beyond convenience. Checkpoint 5 is almost entirely mid-run console
; work -- sf.Intent.Roll, sf.Knockdown, sf.TargetDrone are all switched by hand while
; the rig runs -- and without a console that reaches the game, none of it is possible.
+ConsoleKeys=F1
